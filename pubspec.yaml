name: inkubator_iot
description: "VitaRoot - Smart Plant Incubator"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^17.2.1
  fl_chart: ^0.66.2
  flutter_switch: ^0.3.2
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  flutter_web_auth_2: ^4.1.0
  mqtt_client: 10.3.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1


flutter:

  uses-material-design: true

  assets:
    - assets/logo/vitaroot.png
    - assets/logo/bumn.png
    - assets/logo/danantara.png
    - assets/logo/petrokimia.png
    - assets/logo/pupukindonesia.png
    - assets/area/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700


flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/vitaroot.png
  adaptive_icon_background: "#1B5E20"

flutter_native_splash:
  color: "#1B5E20"
  image: assets/logo/vitaroot.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
